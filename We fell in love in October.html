<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We fell in love in October</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Amiri:wght@400;700&family=Caveat:wght@500&display=swap">
<style>
:root{--wine:#2b0710;--burg:#5a0f1e;--red:#8c1d2f;--gold:#d8b27a;--cream:#f1eadb;--ink:#3a1a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#12030a;font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#frame{position:relative;height:100%;max-height:900px;aspect-ratio:9/16;max-width:100%;background:var(--wine);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 22px 28px}
.slide.on{opacity:1;pointer-events:auto}
#top{position:absolute;top:12px;left:0;right:0;z-index:5;text-align:center;color:#fff;font:700 17px/1.2 system-ui,sans-serif;padding:0 14px;text-shadow:0 1px 6px #000}
#bars{position:absolute;top:0;left:0;right:0;display:flex;gap:4px;padding:6px 10px;z-index:6}
#bars i{flex:1;height:3px;background:#ffffff30;border-radius:2px}#bars i.on{background:var(--gold)}
#count{position:absolute;top:44px;left:12px;z-index:5;font:600 12px system-ui,sans-serif;color:#fff;background:#ffffff1c;padding:4px 10px;border-radius:99px}
/* 1 envelope */
.s1 h1{font-weight:400;font-size:44px;color:var(--gold);margin-bottom:30px;letter-spacing:1px}
.env{position:relative;width:250px;height:165px;background:var(--red);box-shadow:0 14px 34px #0009;cursor:pointer;transition:transform .5s}
.env:before,.env:after{content:"";position:absolute;inset:0}
.env:before{background:linear-gradient(to top right,#0000 49.5%,#00000022 50%) left/50% 100% no-repeat,linear-gradient(to top left,#0000 49.5%,#00000022 50%) right/50% 100% no-repeat}
.flap{position:absolute;top:0;left:0;width:100%;height:100px;background:#741728;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.seal{position:absolute;left:50%;top:76px;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d29c,#b98a43);display:grid;place-items:center;font-size:24px;color:#7a1626;box-shadow:0 3px 8px #0007;transition:.5s}
.env.open .flap{transform:rotateX(180deg)}.env.open .seal{opacity:0;transform:scale(1.6)}.env.open{transform:translateY(20px) scale(.96)}
.hint{margin-top:26px;color:#d8b27a99;font-size:16px;font-style:italic}
/* 2 letter */
.paper{position:relative;width:100%;background:var(--cream);color:var(--ink);padding:44px 22px 26px;filter:drop-shadow(0 10px 22px #000a);clip-path:polygon(0 1%,6% 0,14% 1.2%,23% .2%,33% 1.2%,45% 0,57% 1%,69% .1%,80% 1.2%,91% .2%,100% 1%,99% 25%,100% 50%,99% 76%,100% 99%,90% 100%,78% 99%,64% 100%,50% 99.2%,36% 100%,22% 99%,10% 100%,0 99%,1% 70%,0 40%,1% 15%)}
.wax{position:absolute;top:-30px;left:50%;margin-left:-32px;width:64px;height:58px;font-size:58px;line-height:58px;text-align:center;color:#8f1226;filter:drop-shadow(0 3px 4px #0008);z-index:2}
.paper h2{font-size:21px;font-weight:500;text-align:center;text-decoration:underline;text-underline-offset:5px;letter-spacing:.5px;margin-bottom:14px}
.letter{direction:rtl;text-align:center;font-family:Amiri,serif;font-size:17px;line-height:1.95}
.letter span{opacity:0;transition:opacity .7s}.letter span.in{opacity:1}
/* 3 film */
.s3{background:#4d0d1a;flex-direction:row;gap:14px;align-items:center;justify-content:center}
.film{background:#111;padding:10px 12px;width:150px;display:flex;flex-direction:column;gap:8px;transform:rotate(-2deg);box-shadow:0 10px 24px #000b;border-left:6px dotted #ddd;border-right:6px dotted #ddd}
.film div,.polaroid div{aspect-ratio:3/4;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff9;font:500 13px system-ui,sans-serif;opacity:0;transform:translateY(16px);transition:.7s}
.film div.in{opacity:1;transform:none}
.film div:first-child{background-position:left center}
.note{position:relative;width:130px;height:340px;background:repeating-linear-gradient(var(--cream) 0 21px,#c9c0ad 22px);color:#7b1727;font:500 19px/22px Caveat,cursive;padding:14px 10px;transform:rotate(2deg);box-shadow:0 8px 18px #0008;direction:rtl}
.deco{position:absolute;line-height:0;filter:drop-shadow(0 4px 5px #0009);animation:float 4.5s ease-in-out infinite}
.deco:nth-of-type(even){animation-delay:-2.2s}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}
#top svg{width:17px;height:16px;vertical-align:-2px;margin-inline-start:6px}
.ctrl svg{width:16px;height:16px;fill:#fff}
/* 4 polaroid */
.s4{background:radial-gradient(circle at 30% 20%,#7a1424,#4a0b17)}
.polaroid{width:260px;background:#6d1222;padding:12px 12px 16px;box-shadow:0 14px 30px #000b;transform:rotate(-1.5deg);text-align:center}
.polaroid small{display:block;font:500 9px/1 system-ui,sans-serif;letter-spacing:1.5px;color:#e9c9a0;margin-bottom:8px;text-transform:uppercase}
.polaroid div{opacity:1;transform:none}
.ctrl{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:26px;color:#fff;font-size:16px}
.ctrl b{width:30px;height:30px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:13px}
/* 5 song */
.card{width:100%;background:#000;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 12px 28px #000b;transition:transform .2s}
.card:active{transform:scale(.98)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#8a3b2a,#c9a15c 55%,#5b6a52) center/cover no-repeat;display:grid;place-items:end center;padding-bottom:14px;color:#ffe48a;font:italic 16px Cormorant Garamond,serif}
.dur{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:4px;background:#000c;color:#fff;font:600 12px system-ui,sans-serif;padding:3px 6px;border-radius:4px}.dur svg{width:11px;height:11px;fill:#fff}
.card p{padding:14px;color:#fff;font:700 18px system-ui,sans-serif}.card p em{display:block;margin-top:6px;font:400 13px system-ui,sans-serif;color:#aaa}
.tap{margin-top:22px;color:var(--gold);font-size:19px;font-style:italic;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="frame">
  <div id="bars"></div><div id="count"></div><div id="top"></div>

  <section class="slide s1">
    <h1>Open it</h1>
    <div class="env" id="env"><div class="flap"></div><div class="seal">♥</div></div>
    <p class="hint">for Amira</p>
  </section>

  <section class="slide s2">
    <div class="paper"><div class="wax">♥</div><h2 id="to"></h2><div class="letter" id="letter"></div></div>
  </section>

  <section class="slide s3">
    <div class="film" id="film"></div>
    <div class="note" id="note"></div>
    <span class="deco" style="top:70px;right:18px"><svg viewBox="0 0 64 48" width="62"><path d="M29 26L19 46L24.5 43L28 47.5L33 27Z" fill="#7a1424"/><path d="M35 26L45 46L39.5 43L36 47.5L31 27Z" fill="#8c1d2f"/><path d="M30 22C20 8 6 6 4 14C2 22 10 30 30 26Z" fill="#a3182f"/><path d="M34 22C44 8 58 6 60 14C62 22 54 30 34 26Z" fill="#a3182f"/><path d="M30 23C22 14 12 13 10 17C14 20 22 23 30 24Z" fill="#5e0c1a" opacity=".55"/><path d="M34 23C42 14 52 13 54 17C50 20 42 23 34 24Z" fill="#5e0c1a" opacity=".55"/><path d="M8 13C14 8.5 22 11 27 18M56 13C50 8.5 42 11 37 18" stroke="#f3a3ae" stroke-width="1.4" fill="none" opacity=".55" stroke-linecap="round"/><rect x="27" y="18.5" width="10" height="10" rx="3.5" fill="#c0283f"/></svg></span>
    <span class="deco" style="bottom:36px;right:26px"><svg viewBox="0 0 56 62" width="52"><path d="M17 40C19 26 25 15 33 7M39 41C39 27 36 16 33 7" stroke="#6b4a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M33 7C39-1 51 1 54 7C46 13 38 12 33 7Z" fill="#9a8a4a"/><path d="M35 7.5C42 6 48 6 52 7" stroke="#6d6234" stroke-width=".8" fill="none"/><circle cx="17" cy="49" r="11" fill="#a3182f"/><circle cx="39" cy="50" r="11" fill="#8c1d2f"/><ellipse cx="12.5" cy="45" rx="3.2" ry="2" fill="#fff" opacity=".55" transform="rotate(-35 12.5 45)"/><ellipse cx="34.5" cy="46" rx="3.2" ry="2" fill="#fff" opacity=".5" transform="rotate(-35 34.5 46)"/></svg></span>
  </section>

  <section class="slide s4">
    <div class="polaroid"><small>click here to listen to our song</small><div id="pol"></div>
      <div class="ctrl"><span><svg viewBox="0 0 24 24"><path d="M11 6v12L2 12zM21 6v12l-9-6z"/></svg></span><b>❚❚</b><span><svg viewBox="0 0 24 24"><path d="M13 6v12l9-6zM3 6v12l9-6z"/></svg></span></div></div>
    <span class="deco" style="bottom:30px;left:18px"><svg viewBox="0 0 72 60" width="74"><rect x="10" y="5" width="22" height="11" rx="3" fill="#ddd0b4"/><rect x="4" y="12" width="64" height="44" rx="9" fill="#f1eadb"/><path d="M4 40H68V47A9 9 0 0 1 59 56H13A9 9 0 0 1 4 47Z" fill="#e0d3b8"/><rect x="31" y="12" width="3.5" height="28" fill="#a3182f"/><rect x="34.5" y="12" width="3.5" height="28" fill="#d8b27a"/><rect x="38" y="12" width="3.5" height="28" fill="#5a0f1e"/><rect x="50" y="17" width="12" height="7" rx="2" fill="#2b0710"/><circle cx="14" cy="21" r="3.5" fill="#c0283f"/><circle cx="36" cy="31" r="13" fill="#2b0710"/><circle cx="36" cy="31" r="9" fill="#3d1520" stroke="#d8b27a" stroke-width="1.5"/><circle cx="36" cy="31" r="4" fill="#120308"/><circle cx="32.5" cy="27.5" r="2" fill="#fff" opacity=".6"/><rect x="16" y="49" width="40" height="2.6" rx="1.3" fill="#2b0710" opacity=".45"/></svg></span>
    <span class="deco" style="bottom:28px;right:20px"><svg viewBox="0 0 60 82" width="58"><path d="M30 66V28M30 66L17 33M30 66L43 33" stroke="#7d8a4c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M30 60C18 54 11 45 11 36C21 42 28 50 30 60Z" fill="#7d8a4c"/><path d="M30 60C42 54 49 45 49 36C39 42 32 50 30 60Z" fill="#6c7a40"/><g transform="translate(30 27)"><path d="M0 4C-10 4-13-6-12-22L-6-15L0-26L6-15L12-22C13-6 10 4 0 4Z" fill="#a3182f"/><path d="M0 4C-5 0-6-10 0-26C6-10 5 0 0 4Z" fill="#c0394c"/></g><g transform="translate(17 34) rotate(-16) scale(.85)"><path d="M0 4C-10 4-13-6-12-22L-6-15L0-26L6-15L12-22C13-6 10 4 0 4Z" fill="#8c1d2f"/><path d="M0 4C-5 0-6-10 0-26C6-10 5 0 0 4Z" fill="#b02a40"/></g><g transform="translate(43 34) rotate(16) scale(.85)"><path d="M0 4C-10 4-13-6-12-22L-6-15L0-26L6-15L12-22C13-6 10 4 0 4Z" fill="#8c1d2f"/><path d="M0 4C-5 0-6-10 0-26C6-10 5 0 0 4Z" fill="#b02a40"/></g><path d="M13 52H47L37 81H23Z" fill="#f1eadb"/><path d="M13 52L30 58L47 52L37 81H23Z" fill="#e0d3b8"/><path d="M24 67H36" stroke="#d8b27a" stroke-width="3"/><path d="M30 67C25 62 21 64 23 68C25 71 28 69 30 67C32 69 35 71 37 68C39 64 35 62 30 67Z" fill="#d8b27a"/></svg></span>
  </section>

  <section class="slide s5">
    <div class="card" id="song"><div class="thumb" id="thumb"><span id="thumbTxt">we fell in love in october</span><span class="dur">3:08<svg viewBox="0 0 24 24"><path d="M9 3v12.3A3.5 3.5 0 1 0 11 18.5V8h8V3z"/></svg></span></div>
      <p><span id="songTitle"></span><em>girl in red · YouTube</em></p></div>
    <p class="tap">tap to listen ♥</p>
  </section>
</div>

<script>
/* ===== EDIT HERE ===== */
const CONFIG={
  name:"Amira",
  title:"We fell in love in October!",
  songUrl:"https://www.youtube.com/watch?v=AmTMNntVmbQ",
  songTitle:"girl in red - we fell in love in october",
  songCover:"imgs/song_cover.jpg",
  /* Use \n for a new line */
  letter:"عرفتك من اربع شهور ودخلتي قلبي\nبحبك اكتر من اي حد\nانتي احسن حاجة حصلتلي",
  note:"أنتِ أحلى حاجة حصلتلي ♥ بحبك",
  /* Put your photo paths here (e.g. "photos/1.jpg"). Empty = placeholder. */
  filmPhotos:["imgs/photo_2026-10-04_20-47-28.jpg","imgs/flower_tulip.jpg","imgs/flower_rose.jpg","imgs/flower_autumn.jpg"],
  polaroidPhoto:"imgs/photo_2026-10-04_20-47-31.jpg"
};
/* ===================== */
const $=s=>document.querySelector(s),slides=[...document.querySelectorAll('.slide')];
let cur=0;
$('#top').textContent=CONFIG.title;
$('#top').insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 22"><path d="M12 21C5 15 1 11 1 6.5 1 3 3.7 1 6.5 1 9 1 11 2.5 12 4.5 13 2.5 15 1 17.5 1 20.3 1 23 3 23 6.5 23 11 19 15 12 21Z" fill="#c0283f" stroke="#f1c9a0" stroke-width="1.2"/></svg>');
$('#to').textContent="TO "+CONFIG.name.toUpperCase()+", MY FAV PERSON";
$('#note').textContent=CONFIG.note;
$('#songTitle').textContent=CONFIG.songTitle;
if(CONFIG.songCover){$('#thumb').style.backgroundImage='url("'+CONFIG.songCover+'")';$('#thumbTxt').remove()}
$('#bars').innerHTML=slides.map(()=>'<i></i>').join('');
const bg=(el,src,ph)=>{if(src){el.style.backgroundImage='url("'+src+'")'}else{el.style.background='linear-gradient(135deg,#7d2a3a,#3b0a14)';el.textContent=ph}};
$('#film').innerHTML=CONFIG.filmPhotos.map(()=>'<div></div>').join('');
[...$('#film').children].forEach((d,i)=>bg(d,CONFIG.filmPhotos[i],'photo '+(i+1)));
const pol=$('#pol');pol.style.aspectRatio='1/1';bg(pol,CONFIG.polaroidPhoto,'our photo');
$('#letter').innerHTML=CONFIG.letter.split('\n').map(l=>l.split(' ').map(w=>'<span>'+w+'</span>').join(' ')).join('<br>');
function reveal(sel,step){[...document.querySelectorAll(sel)].forEach((e,i)=>setTimeout(()=>e.classList.add('in'),i*step))}
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.querySelectorAll('#bars i').forEach((b,i)=>b.classList.toggle('on',i<=cur));
  $('#count').textContent=(cur+1)+' of '+slides.length;
  if(cur===1)reveal('#letter span',90);
  if(cur===2)reveal('#film div',650);
}
let opened=false;
$('#env').onclick=e=>{e.stopPropagation();if(opened)return;opened=true;$('#env').classList.add('open');setTimeout(()=>show(1),1100)};
$('#song').onclick=e=>{e.stopPropagation();window.open(CONFIG.songUrl,'_blank','noopener')};
$('#frame').addEventListener('click',e=>{
  if(cur===0&&!opened)return;
  const r=$('#frame').getBoundingClientRect();
  show(e.clientX-r.left<r.width/3?cur-1:cur+1);
});
let x0=null;
$('#frame').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
$('#frame').addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>60){if(cur===0&&!opened)return;show(cur+(d<0?1:-1));}});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&(cur>0||opened))show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
show(0);
</script>
</body>
</html>
